name: MATLAB Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run MATLAB test suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023b

      - name: Run tests
        uses: matlab-actions/run-command@v2
        with:
          command: "addpath(genpath('src')); addpath(genpath('tests')); run_all"
